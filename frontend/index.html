<script>
const api=(p,o={})=>{
  const h={...(o.headers||{})};if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  if(!(o.body instanceof FormData) && !h['Content-Type']) h['Content-Type']='application/json';
  return fetch('/api/v1'+p,{...o,headers:h}).then(async r=>{
    const t=await r.text(); let j; try{j=JSON.parse(t)}catch{j={msg:t}}
    if(r.status===422&&Array.isArray(j.detail)&&j.detail.some(d=>(d.loc||[]).includes('x-user-id'))){authFail();throw j}
    if(r.status===401&&!p.startsWith('/auth/login')&&!p.startsWith('/auth/register')){authFail();throw j}
    if(!r.ok){if(j&&typeof j==='object')j.status=r.status; throw j} return j;
  });
};
const C={bud:'#A8C686',leaf:'#5E7D4F',fruit:'#E08A4B',dead:'#8A8F86'},N={bud:'嫩芽·进行中',leaf:'绿叶·已完成',fruit:'果实',dead:'枯枝·放弃'};
const ICO={text:'#i-doc',image:'#i-img',file:'#i-clip',doc:'#i-doc',pdf:'#i-pdf',excel:'#i-xls',code:'#i-code'};

function isTrunkNode(n){return !n||!n.parent_id||n.is_trunk}
function isIdeaNode(n){if(!n||!n.parent_id)return false;if(n.role==='idea'||n.is_idea)return true;if(n.role==='stage'||n.role==='approach')return false;const p=(tree.nodes||[]).find(x=>x.id==n.parent_id);return !!(p&&!p.parent_id)}
function isStage(n){if(!n||!n.parent_id)return false;if(n.role==='stage')return true;if(n.role==='approach'||n.role==='idea')return false;if(n.role)return false;const p=(tree.nodes||[]).find(x=>x.id==n.parent_id);return !!(p&&isIdeaNode(p))}
function isApproach(n){if(!n||!n.parent_id)return false;if(n.role==='approach')return true;if(n.role==='stage'||n.role==='idea')return false;const p=(tree.nodes||[]).find(x=>x.id==n.parent_id);return !!(p&&isStage(p))}
function stagesOf(ideaId){return kidsOf(ideaId).filter(isStage).sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.id-b.id)}
function approachesOf(stageId){return kidsOf(stageId).filter(n=>isApproach(n)||(!isStage(n)&&!isIdeaNode(n))).sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.id-b.id)}
/* ===== s17: willow canvas forest (replaces SVG umbrella layout) ===== */
function isSmokeTitle(t){
  t=String(t||'');
  return /Round\s*13b|Round13b|ripeness[-_]?smoke|smoke[-_]?test|__test__|测试种子|test[-_]?seed|年轮对比|圆十四|熟度树林|src-check|稀疏叶枝|中密叶枝|茂密叶枝|熟度(青果|膨大|上色)|摘熟(目标|演示)|待摘熟枝|摘熟演示|^perm$/i.test(t);
}
function nodeVisualState(n){
  if(!n) return 'todo';
  if(n.state==='dead' || n.progress==='stuck' || n.progress==='blocked' || n.state==='blocked') return 'blocked';
  if(n.note && /卡住/.test(n.note)) return 'blocked';
  // Prefer explicit progress; only fall back to legacy state when progress is unset
  if(n.progress){
    if(n.progress==='done') return 'done';
    if(n.progress==='active') return 'doing';
    if(n.progress==='pending') return 'todo';
  }
  if(n.state==='leaf'||n.state==='fruit') return 'done';
  if(n.state==='bud') return 'doing';
  return 'todo';
}
function ripeFromNode(n){
  if(!n) return null;
  const r=n.ripeness||'none';
  if(r==='ripe'||n.state==='fruit'&&r==='ripe') return {ripe:3,harvested:true};
  if(r==='coloring') return {ripe:2,harvested:false};
  if(r==='swelling') return {ripe:1,harvested:false};
  if(r==='green') return {ripe:0,harvested:false};
  return null;
}
function fruitNameOf(n){
  if(!n) return '果实';
  if(n.note && n.state==='fruit') return n.note.slice(0,24);
  return n.title||'果实';
}

/** Map live tree.nodes → Willow idea.branches (idea=strand, stages=steps, approach=fork strand). */
function treeToIdea(t){
  const all=t.nodes||[];
  const ideas=all.filter(n=>isIdeaNode(n)&&!isSmokeTitle(n.title))
    .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)||a.id-b.id);
  const branches=[];
  const NOW=Date.now();
  ideas.forEach(idea=>{
    const stages=stagesOf(idea.id).filter(s=>!isSmokeTitle(s.title));
    const steps=stages.map(st=>({
      id:st.id, t:st.title, c:NOW-86400000, st:null, d:null, s:null, note:st.note||'', node:st
    }));
    // synthesize step dates so buildTree ordering works; visual status comes from nodeVisualState
    steps.forEach((s,i)=>{
      const vs=nodeVisualState(s.node);
      s.c=NOW-(steps.length-i)*86400000;
      if(vs==='done'){ s.st=s.c; s.d=s.c+3600000; s.s=null; }
      else if(vs==='doing'){ s.st=s.c; s.d=null; s.s='doing'; }
      else if(vs==='blocked'){ s.st=s.c; s.d=null; s.s='blocked'; }
    });
    let fruitNode=idea;
    let fr=ripeFromNode(idea);
    if(!fr){
      // tip fruit from last stage / idea completion ratio
      const done=steps.filter(s=>nodeVisualState(s.node)==='done').length;
      const tot=Math.max(1,steps.length);
      const ratio=done/tot;
      if(ratio>=0.33 || (idea.ripeness&&idea.ripeness!=='none')){
        fr={ripe:ratio>=0.999?2:ratio>=0.66?1:0, harvested:false};
      }
    }
    // harvested if ripe
    if(fr&&fr.harvested){ /* keep */ }
    else if(idea.ripeness==='ripe'){ fr={ripe:3,harvested:true}; }
    const fruit=fr?{name:fruitNameOf(fruitNode), h:fr.harvested?NOW:null, _ripe:fr.ripe, _node:fruitNode}:null;
    branches.push({
      id:'idea-'+idea.id, name:idea.title, c:NOW-ideas.length*86400000,
      dropped:idea.state==='dead'?NOW:null, dropNote:idea.note||'',
      fruit, steps, node:idea, kind:'idea'
    });
    // approaches = side fork strands
    stages.forEach(st=>{
      approachesOf(st.id).filter(a=>!isSmokeTitle(a.title)).forEach(ap=>{
        const vs=nodeVisualState(ap);
        const step={id:ap.id,t:ap.title,c:NOW,st:null,d:null,s:null,note:ap.note||'',node:ap};
        if(vs==='done'){step.st=NOW;step.d=NOW;}
        else if(vs==='doing'){step.st=NOW;step.s='doing';}
        else if(vs==='blocked'){step.st=NOW;step.s='blocked';}
        const afr=ripeFromNode(ap);
        branches.push({
          id:'ap-'+ap.id, name:ap.title, c:NOW,
          dropped:ap.state==='dead'?NOW:null, dropNote:ap.note||'',
          fruit:afr?{name:fruitNameOf(ap),h:afr.harvested?NOW:null,_ripe:afr.ripe,_node:ap}:null,
          steps:[step], node:ap, kind:'approach', parentStageId:st.id
        });
      });
    });
  });
  // orphan non-idea children of trunk (legacy flat branches) as strands
  const root=all.find(n=>!n.parent_id);
  if(root){
    kidsOf(root.id).filter(n=>!isIdeaNode(n)&&!isStage(n)&&!isApproach(n)&&!isSmokeTitle(n.title)).forEach(n=>{
      const vs=nodeVisualState(n);
      const step={id:n.id,t:n.title,c:NOW,st:null,d:null,s:null,note:n.note||'',node:n};
      if(vs==='done'){step.st=NOW;step.d=NOW;}
      else if(vs==='doing'){step.st=NOW;step.s='doing';}
      else if(vs==='blocked'){step.st=NOW;step.s='blocked';}
      const afr=ripeFromNode(n);
      branches.push({
        id:'leg-'+n.id, name:n.title, c:NOW,
        dropped:n.state==='dead'?NOW:null, dropNote:n.note||'',
        fruit:afr?{name:fruitNameOf(n),h:afr.harvested?NOW:null,_ripe:afr.ripe,_node:n}:null,
        steps:[step], node:n, kind:'legacy'
      });
    });
  }
  return {title:t.title||'我的树', planted:NOW-43*86400000, goal:'', branches};
}

const WUI={
  idea:null, wtree:null, view:null, dv:null, els:null,
  focus:null, windOn:true, reduced:false, S:1, G:1, dpr:1,
  needDraw:false, raf:0, lastDraw:-1e9, lastPlace:0, sig:null,
  stage:null, canvas:null, overlay:null, hills:null, ctx:null
};

function mk(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function screenPt(st,s,rest){
  const p=rest?Willow.strandRestPoint(st,s):Willow.strandPoint(WUI.wtree,st,s);
  const b=WUI.wtree.base,S=WUI.S;
  return {x:b.x+(p.x-b.x)*S, y:b.y+(p.y-b.y)*S};
}
function groundFruitX(bi){
  const T=WUI.wtree, st=T.dataStrands[bi], tip=screenPt(st,st.L,true), b=T.base;
  const minD=T.baseW*WUI.S+30;
  let x=tip.x;
  if(Math.abs(x-b.x)<minD) x=b.x+(x<b.x?-minD:minD);
  return Math.max(22,Math.min(T.W-22,x));
}
function seedPos(){
  const T=WUI.wtree;
  return {x:T.base.x+Math.min(1,WUI.S*2.5)*(T.baseW*0.7+26), y:T.groundY+14};
}
const tr=(e,x,y,k)=>{e.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`+(k!=null&&k!==1?` scale(${k.toFixed(3)})`:'')};

function buildWillowView(idea){
  // Live visual status from API nodes (ignore date-based deriveAt)
  return idea.branches.map(b=>{
    const steps=b.steps.map(s=>({ref:s, st:nodeVisualState(s.node)}));
    const dry=!!(b.node&&b.node.state==='dead');
    const done=steps.filter(x=>x.st==='done').length;
    let fruit=null;
    if(b.fruit){
      const harvested=b.fruit.h!=null;
      let ripe=b.fruit._ripe;
      if(ripe==null){
        const tot=Math.max(1,steps.length);
        const r=done/tot;
        ripe=harvested?3:r>=0.999?2:r>=0.66?1:r>=0.33?0:-1;
      }
      if(ripe>=0) fruit={ripe:Math.min(3,ripe), harvested:harvested||ripe===3};
    }
    return {ref:b, steps, vis:steps.length, done, dry, fruit, stage:''};
  });
}
function computeDV(){
  return WUI.wtree.dataStrands.map((st,bi)=>{
    const v=WUI.view[bi]; if(!v) return null;
    let last=-1,lastDone=-1,doing=-1;
    v.steps.forEach((x,j)=>{if(x.st) last=j; if(x.st==='done') lastDone=j; if(x.st==='doing'&&doing<0) doing=j;});
    const lastS=last>=0?st.nodeS[last]:8;
    let len=lastS+14;
    if(v.fruit&&!v.fruit.harvested&&st.fruitS) len=st.fruitS;
    len=Math.min(len,st.L);
    const leafy=lastDone>=0?Math.min(len,st.nodeS[lastDone]+st.gap*0.5):0;
    const bud=doing>=0?st.nodeS[doing]+4:leafy;
    return {len,leafy,bud,dry:v.dry};
  });
}
function focusNow(){return (WUI.focus!=null&&WUI.view&&WUI.view[WUI.focus])?WUI.focus:null}

function buildOverlay(){
  const W=Willow, ov=WUI.overlay; ov.textContent='';
  const E={branches:[], seed:null};
  const labels=[], inter=[];
  WUI.idea.branches.forEach((b,bi)=>{
    const be={nodes:[],labels:[],blabel:null,fruit:null,flabel:null,gfruit:null,glabel:null};
    const bl=mk('button','blabel'); bl.type='button'; bl.textContent=W.clip(b.name,10.5);
    bl.addEventListener('click',ev=>{ev.stopPropagation(); selectBranch(bi);});
    be.blabel=bl; inter.push(bl);
    b.steps.forEach((s,si)=>{
      const n=mk('button','node','<span class="dot"></span>'); n.type='button';
      n.dataset.nid=s.node?s.node.id:'';
      n.addEventListener('click',ev=>{ev.stopPropagation(); selectStep(bi,si);});
      n.addEventListener('pointerenter',()=>peek(bi,si,true));
      n.addEventListener('pointerleave',()=>peek(bi,si,false));
      const l=mk('span','lbl'); l.textContent=W.clip(s.t,9.6);
      be.nodes.push(n); be.labels.push(l); labels.push(l); inter.push(n);
    });
    if(b.fruit){
      const f=mk('button','fruit',W.FRUIT_SVG(false)); f.type='button'; f.style.transformOrigin='18px 4px';
      f.addEventListener('click',ev=>{ev.stopPropagation(); selectBranch(bi);});
      const g=mk('button','fruit ground',W.FRUIT_SVG(true)); g.type='button'; g.style.transformOrigin='18px 30px';
      g.addEventListener('click',ev=>{ev.stopPropagation(); selectBranch(bi);});
      const fl=mk('span','lbl fruit-l'); fl.textContent=W.clip(b.fruit.name,11);
      const gl=mk('span','lbl fruit-l'); gl.textContent=W.clip(b.fruit.name,11);
      Object.assign(be,{fruit:f,flabel:fl,gfruit:g,glabel:gl});
      labels.push(fl,gl); inter.push(f,g);
    }
    E.branches.push(be);
  });
  const root=(tree.nodes||[]).find(n=>!n.parent_id);
  const sd=mk('button','seed',W.SEED_SVG); sd.type='button';
  sd.setAttribute('aria-label','种子：'+(tree.title||''));
  const sl=mk('span','lbl seed-l'); sl.textContent='种下：'+W.clip(tree.title||'',14); labels.push(sl); E.seedLabel=sl;
  sd.addEventListener('click',ev=>{ev.stopPropagation(); if(root) pickNode(root.id); else clearFocus();});
  E.seed=sd; inter.push(sd);
  for(const l of labels) ov.appendChild(l);
  for(const e of inter) ov.appendChild(e);
  for(const l of labels){l._w=l.offsetWidth; l._h=l.offsetHeight;}
  E.seedLabel.hidden=true;
  for(const be of E.branches){be.blabel._w=be.blabel.offsetWidth; be.blabel._h=be.blabel.offsetHeight;}
  WUI.els=E;
}

function syncOverlay(){
  const E=WUI.els, F=focusNow(), W=Willow;
  if(!E||!WUI.idea) return;
  WUI.idea.branches.forEach((b,bi)=>{
    const be=E.branches[bi], v=WUI.view[bi], other=F!=null&&F!==bi;
    be.blabel.hidden=!v;
    if(v){
      be.blabel.classList.toggle('dryb',v.dry);
      be.blabel.classList.toggle('dim',other);
      be.blabel.classList.toggle('sel',!!(sel&&b.node&&sel.id===b.node.id));
      const txt=W.clip(b.name,10.5)+(v.dry?' · 已放下':'');
      if(be.blabel.textContent!==txt){be.blabel.textContent=txt; be.blabel._w=be.blabel.offsetWidth; be.blabel._h=be.blabel.offsetHeight;}
    }
    b.steps.forEach((s,si)=>{
      const n=be.nodes[si], l=be.labels[si], st=v?v.steps[si].st:null;
      n.hidden=!st; l.hidden=!st;
      if(!st) return;
      if(n.dataset.s!==st){n.dataset.s=st; n.firstChild.innerHTML=W.ICON[st]||'';}
      n.classList.toggle('dry',v.dry);
      n.classList.toggle('dim',other);
      n.classList.toggle('sel',!!(sel&&s.node&&sel.id===s.node.id));
      l.className='lbl '+(v.dry?'todo':st);
    });
    if(be.fruit){
      const fr=v&&v.fruit;
      be.fruit.hidden=!fr||fr.harvested; be.flabel.hidden=be.fruit.hidden;
      be.gfruit.hidden=!fr||!fr.harvested; be.glabel.hidden=be.gfruit.hidden;
      if(fr){
        const c=`var(--fruit-${Math.min(2,fr.ripe)})`;
        be.fruit.style.setProperty('--fc',c); be.gfruit.style.setProperty('--fc','var(--fruit-2)');
        be.fruit.classList.toggle('ripe2',fr.ripe===2);
        for(const x of [be.fruit,be.gfruit]){x.classList.toggle('dim',other); x.classList.toggle('sel',!!(sel&&b.node&&sel.id===b.node.id));}
      }
    }
  });
  E.seed.classList.toggle('sel',!!(sel&&!sel.parent_id));
  E.seedLabel.hidden=WUI.S>0;
}

function positionOverlay(){
  const T=WUI.wtree, E=WUI.els; if(!T||!E||!WUI.idea) return;
  const k=Math.max(0.5,Math.min(1,WUI.S*1.15));
  WUI.idea.branches.forEach((b,bi)=>{
    const v=WUI.view[bi]; if(!v) return;
    const be=E.branches[bi], st=T.dataStrands[bi];
    const top=screenPt(st,12);
    if(be.blabel._off) tr(be.blabel, top.x+be.blabel._off.x, top.y+be.blabel._off.y);
    b.steps.forEach((s,si)=>{
      if(!v.steps[si].st) return;
      const p=screenPt(st, st.nodeS[si]);
      tr(be.nodes[si], p.x, p.y, k);
      const l=be.labels[si]; if(l._off) tr(l, p.x+l._off.x, p.y+l._off.y);
      // keep P map for popovers / fork anim
      if(s.node) P[s.node.id]={x:p.x,y:p.y,d:2,side:p.x<(T.W/2)?'left':'right',curve:0.35};
    });
    if(be.fruit&&v.fruit){
      if(!v.fruit.harvested){
        const p=screenPt(st, st.fruitS);
        tr(be.fruit, p.x, p.y, k);
        if(be.flabel._off) tr(be.flabel, p.x+be.flabel._off.x, p.y+be.flabel._off.y);
        if(b.node) P[b.node.id]=P[b.node.id]||{x:p.x,y:p.y,d:1,side:p.x<(T.W/2)?'left':'right',curve:0.35};
      } else {
        const x=groundFruitX(bi), y=T.groundY+10;
        tr(be.gfruit, x, y, k);
        if(be.glabel._off) tr(be.glabel, x+be.glabel._off.x, y+be.glabel._off.y);
      }
    }
    if(b.node&&!P[b.node.id]){
      const tp=screenPt(st,12);
      P[b.node.id]={x:tp.x,y:tp.y,d:1,side:tp.x<(T.W/2)?'left':'right',curve:0.35};
    }
  });
  const sp=seedPos(); tr(E.seed, sp.x, sp.y, WUI.S>0?1:1.5);
  if(WUI.S===0) tr(E.seedLabel, sp.x+26, sp.y-E.seedLabel._h/2-2);
  const root=(tree.nodes||[]).find(n=>!n.parent_id);
  if(root) P[root.id]={x:sp.x,y:sp.y-20,d:0,side:'right',curve:0.2};
}

function placeLabels(){
  const T=WUI.wtree, E=WUI.els, F=focusNow(), S=WUI.S;
  if(!T||!E||!WUI.idea) return;
  const W=T.W, H=T.H, placed=[], items=[];
  const tools=WUI.stage.querySelector('.stage-tools');
  if(tools){
    const trc=tools.getBoundingClientRect(), sr=WUI.stage.getBoundingClientRect();
    placed.push({x:trc.left-sr.left-4,y:0,w:trc.width+14,h:trc.height+16});
  }
  placed.push({x:0,y:0,w:160,h:48}); // title area
  const sp=seedPos(); placed.push({x:sp.x-16,y:sp.y-16,w:32,h:30});
  const showSteps=S>=0.62, showNames=S>=0.45, narrow=W<560;
  WUI.idea.branches.forEach((b,bi)=>{
    const v=WUI.view[bi]; if(!v) return;
    const be=E.branches[bi], st=T.dataStrands[bi], foc=F===bi, other=F!=null&&!foc;
    const boost=foc?100:0;
    b.steps.forEach((s,si)=>{
      const stt=v.steps[si].st; if(!stt) return;
      const p=screenPt(st, st.nodeS[si], true);
      if(!other) placed.push({x:p.x-11,y:p.y-11,w:22,h:22});
      const l=be.labels[si], w=l._w, h=l._h;
      const pri=v.dry?8:stt==='doing'?(narrow?60:40):stt==='blocked'?(narrow?58:38):stt==='done'?20+si*0.2:16-si*0.2;
      items.push({el:l,ax:p.x,ay:p.y,pri:pri+boost,skip:!showSteps||other,
        c:[[14,-h/2],[-14-w,-h/2],[14,-h/2+10],[-14-w,-h/2+10],[14,-h/2-10],[-14-w,-h/2-10]]});
    });
    const tp=screenPt(st,12,true), bw=be.blabel._w, bh=be.blabel._h;
    items.push({el:be.blabel,ax:tp.x,ay:tp.y,pri:(v.dry?30:50)+boost,skip:!showNames,
      c:[[10,-bh/2],[-10-bw,-bh/2],[-bw/2,-bh-12],[10,-bh/2+14],[-10-bw,-bh/2+14]]});
    if(be.fruit&&v.fruit){
      if(!v.fruit.harvested){
        const p=screenPt(st,st.fruitS,true); placed.push({x:p.x-12,y:p.y+5,w:24,h:26});
        const l=be.flabel,w=l._w,h=l._h;
        items.push({el:l,ax:p.x,ay:p.y,pri:(narrow&&v.fruit.ripe===2?55:45)+boost,skip:!showSteps||other,
          c:[[16,17-h/2],[-16-w,17-h/2],[-w/2,36]]});
      } else {
        const x=groundFruitX(bi), y=T.groundY+10; placed.push({x:x-12,y:y-22,w:24,h:24});
        const l=be.glabel,w=l._w,h=l._h;
        items.push({el:l,ax:x,ay:y,pri:44+boost,skip:!showNames,
          c:[[-w/2,6],[15,-11-h/2],[-15-w,-11-h/2]]});
      }
    }
  });
  items.sort((a,b)=>b.pri-a.pri);
  const hit=r=>placed.some(q=>r.x<q.x+q.w+2&&r.x+r.w+2>q.x&&r.y<q.y+q.h+2&&r.y+r.h+2>q.y);
  const inB=r=>r.x>=4&&r.y>=4&&r.x+r.w<=W-4&&r.y+r.h<=H-4;
  for(const it of items){
    const w=it.el._w, h=it.el._h;
    let ok=null, fallback=null;
    for(const [dx,dy] of it.c){
      const r={x:it.ax+dx,y:it.ay+dy,w,h};
      if(!inB(r)) continue;
      if(!fallback) fallback={x:dx,y:dy};
      if(!it.skip&&!hit(r)){ok={x:dx,y:dy}; placed.push(r); break;}
    }
    it.el._off=ok||fallback||{x:it.c[0][0],y:it.c[0][1]};
    it.el.classList.toggle('hide',!ok);
  }
  WUI.lastPlace=performance.now();
}
function peek(bi,si,on){
  const l=WUI.els&&WUI.els.branches[bi]&&WUI.els.branches[bi].labels[si];
  if(l) l.classList.toggle('peek', on&&l.classList.contains('hide'));
}

function selectStep(bi,si){
  const b=WUI.idea.branches[bi], s=b.steps[si];
  WUI.focus=bi;
  if(s&&s.node) pickNode(s.node.id);
  else { syncOverlay(); placeLabels(); kickWillow(); }
}
function selectBranch(bi){
  const b=WUI.idea.branches[bi];
  WUI.focus=bi;
  if(b&&b.node) pickNode(b.node.id);
  else { syncOverlay(); placeLabels(); kickWillow(); }
}
function clearFocus(){
  WUI.focus=null;
  syncOverlay(); placeLabels(); kickWillow();
}

function kickWillow(){ WUI.needDraw=true; if(!WUI.raf) WUI.raf=requestAnimationFrame(willowLoop); }
function willowLoop(ts){
  WUI.raf=0;
  const wind=WUI.windOn&&!WUI.reduced;
  if(WUI.needDraw||ts-WUI.lastDraw>=30){
    WUI.needDraw=false; WUI.lastDraw=ts;

function ensureWillowDOM(){
  if(WUI.stage) return;
  WUI.stage=document.getElementById('wstage');
  WUI.canvas=document.getElementById('wcanvas');
  WUI.overlay=document.getElementById('woverlay');
  WUI.hills=document.getElementById('whills');
  if(WUI.canvas) WUI.ctx=WUI.canvas.getContext('2d');
  const rm=matchMedia('(prefers-reduced-motion: reduce)');
  WUI.reduced=rm.matches; rm.addEventListener('change',()=>{WUI.reduced=rm.matches; kickWillow();});
  if(typeof Willow!=='undefined') Willow.readTokens();
  const wb=document.getElementById('windBtn');
  if(wb&&!wb._bound){ wb._bound=true;
    wb.addEventListener('click',()=>{WUI.windOn=!WUI.windOn; wb.setAttribute('aria-pressed',WUI.windOn); document.getElementById('windTxt').textContent=WUI.windOn?'风':'无风'; kickWillow();});
  }
  const db=document.getElementById('demoBtn');
  if(db&&!db._bound){ db._bound=true;
    db.addEventListener('click',async()=>{
      includeDemo=!includeDemo;
      db.setAttribute('aria-pressed',includeDemo?'true':'false');
      db.classList.toggle('on',!!includeDemo);
      try{ if(tree&&tree.id) await openTree(tree.id); else await openMyTree(); }catch(e){ console.warn(e); }
    });
  }
  if(WUI.stage&&!WUI.stage._clickBound){ WUI.stage._clickBound=true;
    WUI.stage.addEventListener('click',e=>{
      if(e.target.closest('button')) return;
      const r=WUI.stage.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
      let best=null, bd=20;
      if(WUI.wtree&&WUI.dv) WUI.wtree.dataStrands.forEach((st,bi)=>{
        const d=WUI.dv[bi]; if(!d) return;
        for(let s=0;s<=d.len;s+=5){const p=screenPt(st,s); const dd=Math.hypot(p.x-x,p.y-y); if(dd<bd){bd=dd;best=bi;}}
      });
      if(best!=null) selectBranch(best); else if(WUI.focus!=null) clearFocus();
    });
  }
  if(WUI.stage&&!WUI.stage._ro){ WUI.stage._ro=true;
    let rt=0, lastW=0, lastH=0;
    new ResizeObserver(()=>{
      const r=WUI.stage.getBoundingClientRect();
      if(Math.abs(r.width-lastW)<2&&Math.abs(r.height-lastH)<2) return;
      lastW=r.width; lastH=r.height;
      clearTimeout(rt); rt=setTimeout(()=>tree&&draw(), WUI.wtree?120:0);
    }).observe(WUI.stage);
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden) kickWillow();});
}

function layoutWillow(){
  ensureWillowDOM();
  if(!WUI.stage||typeof Willow==='undefined'||!tree) return null;
  const r=WUI.stage.getBoundingClientRect(), W=Math.round(r.width), H=Math.round(r.height);
  if(!W||!H) return null;
  WUI.dpr=Math.min(2, window.devicePixelRatio||1);
  WUI.canvas.width=Math.round(W*WUI.dpr); WUI.canvas.height=Math.round(H*WUI.dpr);
  WUI.idea=treeToIdea(tree);
  WUI.wtree=Willow.buildTree(W,H,WUI.idea);
  Willow.prepRender(WUI.wtree);
  Willow.drawHills(WUI.hills, W, H, WUI.wtree.groundY);
  WUI.view=buildWillowView(WUI.idea);
  // growth / size from data density
  const nSteps=WUI.idea.branches.reduce((a,b)=>a+b.steps.length,0);
  WUI.G=Math.min(1, 0.35+nSteps*0.04);
  WUI.S=WUI.idea.branches.length? Math.min(1, 0.55+nSteps*0.03):0.2;
  WUI.dv=computeDV();
  buildOverlay();
  syncOverlay();
  placeLabels();
  // update focus from sel
  if(sel){
    const ix=WUI.idea.branches.findIndex(b=>{
      if(b.node&&b.node.id===sel.id) return true;
      return b.steps.some(s=>s.node&&s.node.id===sel.id);
    });
    if(ix>=0) WUI.focus=ix;
  }
  kickWillow();
  return {w:W,h:H};
}

function weepCtrl(a,b,curve,side){
  const dx=b.x-a.x, dy=b.y-a.y, c=curve!=null?curve:0.35;

function weepTaper(a,b,w0,w1,curve,side){
  const{c1x,c1y,c2x,c2y}=weepCtrl(a,b,curve,side);

    if(where)fieldErr(where);else err.textContent=m||'网络有点问题，稍后再试'}
}
let pickAv='pinecone';
function showAvatarStep(){
  pickAv=ME.avatar||'pinecone';
  const c=document.getElementById('authcard');
  c.innerHTML=`<h1 style="font-size:20px">选一个森林里的样子</h1><div class="sub">别人在果子市集里会看到它</div>
   <div class="avgrid">${Object.keys(AVS).map(k=>`<div class="avopt ${k===pickAv?'on':''}" data-k="${k}" onclick="pickAv='${k}';document.querySelectorAll('.avopt').forEach(x=>x.classList.toggle('on',x.dataset.k===pickAv))">${avSVG(k,48,32)}${AVN[k]}</div>`).join('')}</div>
   <label class="nlab" for="au-nick">你在市集里的名字</label>
   <input id="au-nick" class="nick" placeholder="2–12 个字" value="${esc(ME.nickname||ME.username)}" maxlength="12">
   <div class="ferr nickerr" id="au-nick-err"></div><div class="aerr" id="au-err"></div>
   <button class="btn" onclick="saveProfile()">就是它了</button>
   <div class="sub" style="margin-top:10px;font-size:12px"><a class="lk" onclick="skipProfile()">先跳过</a></div>`;
}
async function saveProfile(){
  const nick=document.getElementById('au-nick').value.trim();const c=nickCheck(nick);
  if(c)return nickErr('au-nick','au-nick-err',c);nickErr('au-nick','au-nick-err','');
  try{ME=await api('/auth/me',{method:'PATCH',body:JSON.stringify({avatar:pickAv,nickname:nick})});enterApp()}
  catch(e){const d=e.detail||{};if(d.code==='BAD_NICKNAME')nickErr('au-nick','au-nick-err',d.msg||'这个名字不能用，换一个吧');else document.getElementById('au-err').textContent=d.msg||'没保存上，再试一次'}
}
async function enterApp(){
  document.body.classList.add('authed');renderChip();
  tree=null;sel=null;goto('forest');
  const rs=JSON.parse(sessionStorage.getItem('guozi_resume')||'null');sessionStorage.removeItem('guozi_resume');
  if(rs&&rs.uid&&ME&&rs.uid!==ME.id){await loadList();setTimeout(draw,200);return} // different account: don't restore
  if(rs&&rs.view==='market'&&!rs.ro){goto('market');await renderList();return}
  if(rs&&rs.ro&&rs.treeId){await renderList();await openMarketTree(rs.treeId);if(rs.selId){sel=tree.nodes.find(n=>n.id==rs.selId)||sel;draw();showRO()}return}
  await loadList(rs&&rs.treeId||undefined);setTimeout(draw,200);
  if(rs&&rs.selId&&tree){sel=tree.nodes.find(n=>n.id==rs.selId)||sel;draw();await show();
    if(rs.draft&&rs.draft.kind&&sel.id==rs.draft.nodeId){askState(rs.draft.kind);setTimeout(()=>{if(window.pn)pn.value=rs.draft.note||'';if(window.pl)pl.value=rs.draft.link||''},0)}}
}
let pendingDraft=null;
function saveResume(){
  const pop=document.querySelector('.pop');let draft=pendingDraft;
  if(pop&&sel){draft={kind:pop.classList.contains('fruit')?'fruit':'dead',nodeId:sel.id,note:window.pn?.value||'',link:window.pl?.value||''}}
  sessionStorage.setItem('guozi_resume',JSON.stringify({uid:ME?.id,view,ro,treeId:tree?.id,selId:sel?.id,draft}));
}
async function skipProfile(){try{ME=await api('/auth/me',{method:'PATCH',body:JSON.stringify({avatar:'leaf'})})}catch{}enterApp()}
function togglePw(b){const i=b.parentNode.querySelector('input');const show=i.type==='password';i.type=show?'text':'password';b.classList.toggle('on',show);b.title=show?'隐藏密码':'显示密码'}
const AGREE_VER='2026-10-v1';
const DOCS={terms:['用户协议','<p>欢迎来到「让果子熟」。这里是一片安静的树林，用来种下想法、记录成长。</p><p>1. 请只上传你有权分享的内容；公开到果子市集的树，其他人可以免费查看并采一颗种子（复制枝干）。</p><p>2. 请友善对待别人的果实，不要发布违法、侵权或骚扰内容。</p><p>3. 我们可能会更新本协议，重要变化会在站内提示。</p><p class="sub">（占位文本，正式版本待法务确认）</p>'],
 privacy:['隐私政策','<p>我们只收集让树林运转所需的最少信息：用户名、加密后的密码、昵称和头像，以及你种下的树、枝叶和附件。</p><p>公开的树会展示你的昵称和头像；未公开的内容只有你自己能看到。</p><p>我们不会出售你的个人信息。你可以随时联系我们删除账号与数据。</p><p class="sub">（占位文本，正式版本待法务确认）</p>']};
function showDoc(k){const [h,b]=DOCS[k];const m=document.createElement('div');m.className='modal-bg';m.style.zIndex=200;
  m.innerHTML=`<div class="modal doc"><h2>${h}</h2><div class="docbody">${b}</div><div class="mbtns"><button class="btn" onclick="this.closest('.modal-bg').remove()">我知道了</button></div></div>`;
  m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m)}
async function boot(){
  if(!TOKEN){showAuth('login');return}
  try{ME=await api('/auth/me');enterApp()}catch(e){if(document.body.classList.contains('authed')||!TOKEN)return;showAuth('login')}
}

bindTreePointer();
boot();
</script></body></html>
